name: macOS package checks

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test native controls, resources, and appearances
        run: swift test --jobs 2
      - name: Build the showcase
        run: swift build --product OnePlusUIShowcase --jobs 2
      - name: Capture the showcase in the isolated hosted session
        run: |
          showcase="$(swift build --show-bin-path)/OnePlusUIShowcase"
          "$showcase" &
          showcase_pid=$!
          trap 'kill "$showcase_pid" 2>/dev/null || true' EXIT
          sleep 5
          screencapture -x "$RUNNER_TEMP/oneplus-ui-showcase.png"
      - uses: actions/upload-artifact@v4
        with:
          name: oneplus-ui-showcase
          path: ${{ runner.temp }}/oneplus-ui-showcase.png
          if-no-files-found: error
